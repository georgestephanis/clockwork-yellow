; PlatformIO Project Configuration File for Clockwork Yellow (ESP32 CYD GeoChron Clock)
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0 ; Locked to a stable, tested release
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DDETECT_TOUCH=1
    -DTOUCH_CS=33
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1   ; Font 1: Original 8x8 font
    -DLOAD_FONT2=1  ; Font 2: Small 16-pixel font
    -DLOAD_FONT4=1  ; Font 4: Medium 26-pixel signpost font
    -DLOAD_FONT6=1  ; Font 6: Large 48-pixel clock font
    -DLOAD_FONT7=1  ; Font 7: 7-segment clock font
    -DLOAD_FONT8=1  ; Font 8: Very large 75-pixel font
    -DLOAD_GFXFF=1  ; FreeFonts
    -DSMOOTH_FONT=1 ; Smooth/anti-aliased font support
